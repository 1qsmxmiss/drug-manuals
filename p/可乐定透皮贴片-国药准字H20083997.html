<div class="sub">批准文号：国药准字H20083997 ｜ 注意事项</div>
<div class="audio-box"><b>&#128266; 语音朗读（点击播放）</b>

<div class="content"><p>1.贴用本品时可以淋浴，但不可长时间浸泡或搓洗贴药部位以防药片脱落。</p>
<p>2.本品为外用贴片，连续使用可能产生皮肤过敏反应（包括一般性皮疹、荨麻疹或血管水肿），口服盐酸可乐定产生过敏反应的病人，对可乐定贴片也可能引起过敏反应。</p>
<p>所以每次贴用时更换贴用部位。</p>
<p>3.该药在使用时应注意新出现的症状，特别是与运动有关的，如突然出现的头晕，易激惹，过度镇静，晕厥等症状都需要密切临床监测、最好进行动态心电图或超声心电图检查。</p>
<p>4.肝肾功能不全的患者应慎用。</p></div>
