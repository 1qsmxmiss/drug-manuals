<div class="content"><p>1.忌食辛辣，少进油腻。</p>
<p>2.感冒时不宜服用。</p>
<p>3.伴有月经紊乱或其他疾病如：高血压、心脏病、糖尿病、肾病等患者，应在医师指导下服用。</p>
<p>4.眩晕症状较重者，应去医院就诊。</p>
<p>5.严格按照用法用量服用，服药2周症状无缓解，应去医院就诊。</p>
<p>本品不宜长期服用。</p>
<p>6.对本品过敏者禁用，过敏体质者慎用。</p>
<p>7.药品性状发生改变时禁止服用。</p>
<p>8.请将此药品放在儿童不能接触的地方。</p>
<p>9.如正在服用其他药品，使用本品前请咨询医师或药师。</p></div>
