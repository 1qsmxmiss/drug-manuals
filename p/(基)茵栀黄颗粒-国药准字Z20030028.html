<h1>(基)茵栀黄颗粒</h1>
<div class="sub">批准文号：国药准字Z20030028 ｜ 注意事项</div>
<div class="audio-box"><b>&#128266; 语音朗读（点击播放）</b>
<audio controls preload="metadata" src="../audio/(基)茵栀黄颗粒-国药准字Z20030028.mp3"></audio>

<div class="content"><p>1.鉴于茵栀黄口服制剂有葡萄糖-6-磷酸脱氢酶（G6PD）缺乏患者发生溶血的个例，目前关联性尚无法确定，有待进一步研究，建议葡萄糖-6-磷酸脱氢酶（G6PD）缺乏者谨慎使用。</p>
<p>2.脾虚大便溏者慎用。</p>
<p>3.妊娠及哺乳期妇女慎用。</p>
<p>4.本品[用法用量]为成人用法用量。</p>
<p>5.黄疸属阴黄者不宜使用。</p>
<p>6.本品为处方药，应在医生指导下使用。</p>
<p>服药过程中，注意观察大便性状，如出现腹泻应及时告知医生，如出现腹泻水样便、蛋花汤样便、粘液便、血便，或大便带血及肛周红肿等情况，应停药并及时就医。</p></div>
