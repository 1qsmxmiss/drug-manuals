<h1>(基)硫酸阿托品眼用凝胶</h1>
<div class="sub">批准文号：国药准字H20052295 ｜ 注意事项</div>
<div class="audio-box"><b>&#128266; 语音朗读（点击播放）</b>
<audio controls preload="metadata" src="../audio/(基)硫酸阿托品眼用凝胶-国药准字H20052295.mp3"></audio>
</div>
<div class="content"><p>1.阿托品类扩瞳药对正常眼压无明显影响，但对眼压异常或窄角、浅前房眼患者，应用后可使眼压明显升高而有激发青光眼急性发作的危险。</p>
<p>故对这类病例和40岁以上的病人不应用阿托品滴眼。</p>
<p>2.本品应在医师指导下使用。</p>
<p>3.用药时管嘴勿接触眼部，以防污染药品。</p>
<p>4.滴眼后用手指压迫内眦泪囊部(见说明书下面图示)，以减少药物的全身吸收，防止或减轻副作用。</p>
<p>5.本品系外用药品，严禁口服。</p>
<p>6.开封后最多可使用四周。</p>
<p>7.请妥为保存，放置儿童触摸不到的地方，避免儿童误食中毒。</p></div>
