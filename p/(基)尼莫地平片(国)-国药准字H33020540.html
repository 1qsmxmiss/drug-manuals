<div class="content"><p>1.脑水肿及颅内压增高患者须慎用。</p>
<p>2.尼莫地平的代谢产物具有毒性反应，肝功能损害者应当慎用。</p>
<p>3.本品可引起血压的降低。</p>
<p>在高血压合并蛛网膜下隙出血或脑卒中患者中，应注意减少或暂时停用降血压药物，或减少本品的用药剂量。</p>
<p>4.可产生假性肠梗阻，表现为腹胀、肠鸣音减弱。</p>
<p>当出现上述症状时应当减少用药剂量和保持观察。</p>
<p>5.避免与β-阻断剂或其他钙拮抗剂合用。</p></div>
