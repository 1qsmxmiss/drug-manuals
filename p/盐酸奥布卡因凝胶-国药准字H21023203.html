<h1>盐酸奥布卡因凝胶</h1>
<div class="sub">批准文号：国药准字H21023203 ｜ 注意事项</div>
<div class="audio-box"><b>&#128266; 语音朗读（点击播放）</b>
<audio controls preload="metadata" src="../audio/盐酸奥布卡因凝胶-国药准字H21023203.mp3"></audio>
</div>
<div class="content"><p>1.为避免使用本品后发生过敏反应，故在应用本品时应注意密切观察患者用药后的状态反应；</p>
<p>尽量采用较低浓度及较小剂量给药。</p>
<p>2.本品不可作为丁氧普鲁卡因滴眼液的替代品在眼科使用。</p>
<p>3.对以下患者，不能合用血管收缩剂(如肾上腺素、去甲肾上腺素等)(1)对血管收缩剂有过敏史者。</p>
<p>(2)有高血压、动脉硬化、心功能不全、甲状腺机能亢进、糖尿病及血管痉挛性疾病者。</p>
<p>4.本品为非无菌制剂。</p></div>
