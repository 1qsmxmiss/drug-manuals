<div class="content"><p>1.重要的基本注意事项应注意本品的治疗是对症疗法，而不是病因疗法。</p>
<p>本品可能掩盖眼部感染的症状，因此用于治疗感染引起的炎症时，要充分观察，慎重给药。</p>
<p>2.应用时注意事项给药途径：仅限滴眼使用。</p>
<p>给药时：滴眼时，应注意药瓶前端不要直接接触眼睛。</p>
<p>发药时：在交给患者时，指导患者将药瓶避光保存。</p></div>
