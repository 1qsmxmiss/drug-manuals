<div class="content"><p>1、由于抗组胺药能清除或减轻皮肤对所有变应原的阳性反应，因而在进行任何皮肤过敏性试验前48小时，应停止使用本品。</p>
<p>2、肝功能不良、膀胱颈阻塞或尿潴留、尿道张力过强、前列腺肥大、青光眼患者应遵医嘱用药。</p>
<p>3、若发生嗜睡或头晕，请避免开车和操作机器。</p>
<p>4、严重肾功能不全患者慎用。</p></div>
