<h1>(基)黄体酮软胶囊(30#)</h1>
<div class="sub">批准文号：国药准字HJ20160265 ｜ 注意事项</div>
<div class="audio-box"><b>&#128266; 语音朗读（点击播放）</b>
<audio controls preload="metadata" src="../audio/(基)黄体酮软胶囊(30#)-国药准字HJ20160265.mp3"></audio>

<div class="content"><p>-该药物不适用于治疗所有的自发性流产，尤其是对遗传因素造成的病症（占50%以上）无效。</p>
<p>-建议在妊娠3个月之后采用阴道给药方式使用本品，同时观察患者是否出现瘙痒、黄疸或肝功能异常。</p>
<p>如有上述不良反应发生，则立即停止用药并进行相应治疗。</p>
<p>-按照规定使用本品无避孕作用。</p>
<p>-口服给药，最好远隔进餐时间，最好晚上睡觉前服用。</p>
<p>-服用该药物会分散汽车司机和机械师的注意力，尤其是口服给药后，会有困倦，嗜睡和头晕眼花的感觉。</p></div>
