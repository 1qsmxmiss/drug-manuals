<div class="content"><p>1.避免接触眼睛和其他粘膜(如口、鼻等)。</p>
<p>2.用药部位如有灼烧感、瘙痒、红肿等应停止用药，洗净。</p>
<p>必要时向医师咨询。</p>
<p>3.对本品过敏者禁用，过敏体质者慎用。</p>
<p>4.本品性状发生改变时禁止使用。</p>
<p>5.请将此药品放在儿童不能接触的地方。</p>
<p>6.儿童必须在成人监护下使用。</p>
<p>7.如正在使用其他药品，使用本品前请咨询医师或药师。</p></div>
