<div class="content"><p>1.低血压症状性低血压可能发生，特别是在严重的主动脉狭窄患者中。</p>
<p>因本品的扩血管作用是逐渐产生的，服用本品后发生急性低血压的情况罕有报道。</p>
<p>2.心绞痛加重或心肌梗死极少数患者，特别是伴有严重冠状动脉阻塞性疾病的患者，在开始使用苯磺酸氨氯地平治疗或增加剂量时，可出现心绞痛恶化或发生急性心肌梗死。</p>
<p>3.肝功能受损病人的使用因本品通过肝脏大量代谢，并且肝功能不全患者的血浆清除半衰期(t1/2)为56小时，因此本品用于重度肝功能不全患者时应缓慢增量。</p></div>
