<h1>(基)(集)阿法骨化醇软胶囊</h1>
<div class="sub">批准文号：国药准字J20171090 ｜ 注意事项</div>
<div class="audio-box"><b>&#128266; 语音朗读（点击播放）</b>
<audio controls preload="metadata" src="../audio/(基)(集)阿法骨化醇软胶囊-国药准字J20171090.mp3"></audio>

<div class="content"><p>阿法骨化醇可以增加肠道钙磷吸收，所以应监测血清中的钙磷水平，尤其是对肾功能不全的患者。</p>
<p>在服用阿法骨化醇治疗的过程中，至少每三个月进行一次血浆和尿(24小时收集)钙水平的常规检验。</p>
<p>如果在服用期间出现高血钙或高尿钙，应迅速停药直至血钙水平恢复正常(大约需一周时间)。</p>
<p>然后可以按末次剂量减半给药。</p>
<p>当骨骼愈合的生化指标(如血浆中碱性磷酸酯酶水平趋向正常)时，如不适当地减少阿法迪三的用量，则可能发生高血钙症，一旦出现高血钙症就应立即中止钙的补充。</p></div>
