<h1>★维胺酯胶囊</h1>
<div class="sub">批准文号：国药准字H50021842 ｜ 注意事项</div>
<div class="audio-box"><b>&#128266; 语音朗读（点击播放）</b>
<audio controls preload="metadata" src="../audio/★维胺酯胶囊-国药准字H50021842.mp3"></audio>

<div class="content"><p>1．女性患者服药期间及停药后半年内应采取严格避孕措施。</p>
<p>2．肝肾功能严重不全者慎用。</p>
<p>3．治疗前后应定期监测肝功能。</p>
<p>4．应避免同其他潜在的肝毒性药物合并使用。</p>
<p>5．重症糖尿病、脂质代谢障碍者禁用。</p>
<p>6．禁与维生素A同服。</p>
<p>7．酗酒者慎用。</p>
<p>8．避免强烈日光或紫外线过度照射。</p>
<p>9．服药期间不得驾驶机、车、船、从事高空作业、机械作业及操作精密仪器。</p>
<p>10．如出现视觉障碍，建议及早眼科检查。</p></div>
