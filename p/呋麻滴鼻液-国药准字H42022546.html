<div class="content"><p>1、小儿、孕妇慎用。</p>
<p>2、频繁使用可产生“反跳”现象，出现更为严重的鼻塞，长期使用可造成鼻黏膜损伤。</p>
<p>3、冠心病、高血压、甲状腺功能亢进、糖尿病、闭角型青光眼患者慎用。</p>
<p>4、使用后拧紧瓶盖，以防污染。</p>
<p>5、运动员慎用。</p>
<p>6、对本品过敏者禁用，过敏体质者慎用。</p>
<p>7、本品性状发生改变时禁止使用。</p>
<p>8、请将本品放在儿童不能接触的地方。</p>
<p>9、儿童必须在成人监护下使用。</p>
<p>10、如正在使用其他药品，使用本品前请咨询医师或药师。</p></div>
