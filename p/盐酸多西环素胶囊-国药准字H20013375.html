<div class="content"><p>1．应用本品时可能发生耐药菌的过度繁殖。</p>
<p>一旦发生二重感染，即停用本品并予以相应治疗。</p>
<p>2．治疗性病时，如怀疑同时合并梅毒螺旋体感染，用药前须行暗视野显微镜检查及血清学检查，后者每月1次，至少4次。</p>
<p>3．长期用药时应定期随访检查血常规以及肝功能。</p>
<p>4．肾功能减退患者可应用本品，不必调整剂量，应用本品时通常亦不引起血尿素氮的升高。</p>
<p>5．本品可与食品、牛奶或含碳酸盐饮料同服。</p></div>
