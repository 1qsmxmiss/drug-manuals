<div class="content"><p>1.下列患者需慎重给药（1）有药物过敏病史的患者（2）有肝功能障碍的患者[有时会使肝功能恶化]2.重要的一般性注意服用本剂时，有时会出现四肢无力、站立不稳、困倦等症状。</p>
<p>当出现这些症状时，应减少用量或停止用药。</p>
<p>用药期间，应注意不宜从事驾驶车辆等有危险性的机械操作。</p></div>
