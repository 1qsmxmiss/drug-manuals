<div class="audio-box"><b>&#128266; 语音朗读（点击播放）</b>

<div class="content"><p>1．本品连续使用不宜超过3个疗程。</p>
<p>2．含漱时至少在口腔内停留2-5分钟。</p>
<p>3．本品仅供含漱用。</p>
<p>含漱后吐出。</p>
<p>不得咽下。</p>
<p>4．用时应避免接触眼睛。</p>
<p>5．对本品过敏者禁用，过敏体质者慎用。</p>
<p>6．本品性状发生改变时禁止使用。</p>
<p>7．请将本品放在儿童不能接触的地方。</p>
<p>8．儿童必须在成人监护下使用。</p>
<p>9．如正在使用其它药品，使用本品前请咨询医师或药师。</p></div>
