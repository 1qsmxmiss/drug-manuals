<div class="content"><p>1.肠梗阻是胰纤维性囊肿病（mucoviscidosis）患者的常见并发症，服用本品一旦观察到有类似肠梗阻症状，应考虑肠道狭窄的可能性。</p>
<p>2.本品禁用于急性胰腺炎以及慢性胰腺炎活动期急性发作的患者。</p>
<p>但对于胰酶缺乏的患者，饮食恢复期服用本品有时会有帮助。</p>
<p>3.服用本品如症状加重，需及时就医。</p></div>
