<div class="content"><p>1.本品不可长期使用。</p>
<p>沙眼患者一般用药8周，之后继续用药时应慎重。</p>
<p>为了防止耐药菌的出现等，原则上应确认敏感性，将用药期限限制在治疗疾病所需的最少时间以内。</p>
<p>2.本品仅用于涂眼。</p></div>
