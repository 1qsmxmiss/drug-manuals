<h1>(基)破伤风人免疫球蛋白(成都)</h1>
<div class="sub">批准文号：国药准字S10880001 ｜ 注意事项</div>
<div class="audio-box"><b>&#128266; 语音朗读（点击播放）</b>

<div class="content"><p>1.本品只能臀部肌内注射。</p>
<p>2.应用本品作被动免疫的同时，可使用吸附破伤风疫苗进行主动免疫，但注射部位和用具应分开。</p>
<p>3.本品瓶子有裂纹、瓶盖松动、或超过有效期时不得使用。</p>
<p>4.本品应为无色或淡黄色可带乳光澄清液体。</p>
<p>久存可能出现微量沉淀，但一经摇动应立即消散，如有摇不散的沉淀或异物不得使用。</p>
<p>5.本品一旦开启应立即一次性用完，未用完部分应废弃，不得留作下次使用或分给他人使用。</p>
<p>6.运输及贮存过程中严禁冻结。</p></div>
