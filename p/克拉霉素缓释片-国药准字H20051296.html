<div class="content"><p>据报道，几乎所有的抗生素包括大环内酯类可能导致轻度至危及生命的假膜性大肠炎。</p>
<p>克拉霉素主要经肝脏排泄。</p>
<p>因此，对肝功能受损患者给药时应慎重。</p>
<p>对肾功能中至重度受损患者给予克拉霉素时也应小心。</p>
<p>还应注意克拉霉素与其它大环内酯类药物及林可霉素和克林霉素发生交叉耐药的可能性。</p>
<p>β-内酰胺酶的产生应不影响克拉霉素的活性。</p>
<p>注意：多数耐新青霉素Ⅰ和Ⅱ的菌株对克拉霉素耐药。</p></div>
