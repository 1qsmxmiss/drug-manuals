<div class="sub">批准文号：国药准字H20000609 ｜ 注意事项</div>
<div class="audio-box"><b>&#128266; 语音朗读（点击播放）</b>

<div class="content"><p>1.服用本品可能引起视力模糊，用药期间驾驶车辆、开动机器和进行危险作业者应当注意。</p>
<p>2.肝功能明显低下的患者、每次剂量不得超过半片(1mg)。</p>
<p>3.肾功能低下的患者、自主性神经疾病患者、裂孔疝患者慎用本品。</p>
<p>4.由于尿潴留的风险，本品慎用于膀胱出口梗阻的病人；</p>
<p>由于胃滞纳的风险，也慎用于患胃肠道梗阻性疾病，如幽门狭窄的患者。</p>
<p>5.尚无儿童用药经验，不推荐儿童使用。</p>
<p>6.孕妇慎用本品，哺乳期间服用本品应停止哺乳。</p></div>
