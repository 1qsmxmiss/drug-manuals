<div class="content"><p>1.一般不宜用于溃疡病或支气管哮喘患者。</p>
<p>2.口服本品期间饮酒，则可引起双硫仑样反应，表现为皮肤潮红、瘙痒、发热、头痛、恶心、腹痛、心动过速、血压升高、胸闷、烦躁等，故服药期间和停药后5天内，禁止饮酒。</p>
<p>3.葡葡糖-6-磷酸脱氢酶(G-6PD)缺乏者可致溶血性贫血。</p>
<p>4.动物实验显示呋喃唑酮对动物有致癌风险，但临床至今未有对人类致癌的病例报道，建议使用时权衡利弊。</p></div>
