<div class="content"><p>(1)不宜与酸、碱类配伍。</p>
<p>(2)慎用：低钾血症；</p>
<p>不完全性房室传导阻滞；</p>
<p>高钙血症；</p>
<p>甲状腺功能低下；</p>
<p>缺血性心脏病；</p>
<p>心肌梗死；</p>
<p>心肌炎；</p>
<p>肾功能损害。</p>
<p>(3)用药期间应注意随访检查：血压、心率及心律；</p>
<p>心电图；</p>
<p>心功能监测；</p>
<p>电解质尤其钾、钙、镁；</p>
<p>肾功能；</p>
<p>疑有洋地黄中毒时，应作地高辛血药浓度测定。</p>
<p>过量时，由于蓄积性小，一般于停药后1-2天中毒表现可以消退。</p>
<p>(4)应用时注意监测地高辛血药浓度。</p>
<p>(5)应用本品剂量应个体化。</p></div>
