<div class="content"><p>1.结核病、急性细菌性或病毒性感染患者慎用，必要应用时，必须给予适当的抗感染治疗。</p>
<p>2.长期服药后，停药前应逐渐减量。</p>
<p>3.糖尿病、骨质疏松症、肝硬化、肾功能不良、甲状腺功能低下患者慎用。</p>
