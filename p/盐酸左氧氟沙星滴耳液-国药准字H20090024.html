<div class="content"><p>1．只用于滴耳。</p>
<p>2．本品一般适用于中耳炎局限在中耳粘膜部位的局部治疗。</p>
<p>若炎症已漫及鼓室周围时，除局部治疗外，应同时服用口服制剂。</p>
<p>3．使用本品时若药温过低，可能会引起眩晕。</p>
<p>因此，使用温度应接近体温。</p>
<p>4．出现过敏症状时应立即停药。</p>
<p>5．使用本品的疗程以4周为限。</p>
<p>若继续给药时，应慎用。</p></div>
