<h1>(集)(基)盐酸伊曲康唑胶囊</h1>
<div class="sub">批准文号：国药准字H20070141 ｜ 注意事项</div>
<div class="audio-box"><b>&#128266; 语音朗读（点击播放）</b>
<audio controls preload="metadata" src="../audio/(集)(基)盐酸伊曲康唑胶囊-国药准字H20070141.mp3"></audio>

<div class="content"><p>1.对持续用药超过1个月的患者，以及治疗过程中如出现厌食、恶心、呕吐、疲劳、腹痛或尿色加深的患者，建议检查肝功能。</p>
<p>如果出现异常，应停止用药。</p>
<p>2.伊曲康唑绝大部分在肝脏代谢，因而肝功能异常患者慎用（除非治疗的必要性超过肝损伤的危险性）。</p>
<p>3.当发生神经系统症状时应终止治疗。</p>
<p>4.对肾功能不全的病人，本品的排泄减慢，建议监测本品的血药浓度以确定适宜的剂量。</p></div>
