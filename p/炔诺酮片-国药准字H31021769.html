<div class="content"><p>1.妊娠4个月内慎用，不宜用作早孕试验。</p>
<p>2.心血管疾病、高血压、肾功能损害、糖尿病、哮喘病、癫痫、偏头痛、未明确诊断的阴道出血、有血栓病史(晚期癌瘤治疗除外)、胆囊疾病和有精神抑郁史者慎用。</p>
<p>3.长期用药需注意检查肝功能，特别注意乳房检查。</p></div>
