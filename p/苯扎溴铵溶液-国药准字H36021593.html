<div class="content"><p>1.本品为外用消毒防腐药，切忌内服。</p>
<p>2.不得用塑料或铝制容器贮存。</p>
<p>3.低温时可能出现混浊或沉淀，可置于温水中加温，振摇使溶后使用。</p>
<p>4.用药部位如有烧灼感、瘙痒、红肿等情况应停药，并将局部药物洗净，必要时向医师咨询。</p>
<p>5.对本品过敏者禁用，过敏体质者慎用。</p>
<p>6.本品性状发生改变时禁止使用。</p>
<p>7.请将本品放在儿童不能接触的地方。</p>
<p>8.儿童必须在成人监护下使用。</p>
<p>9.如正在使用其他药品，使用本品前请咨询医师或药师。</p></div>
