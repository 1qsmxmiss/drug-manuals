<h1>(基)硝酸毛果芸香碱滴眼液</h1>
<div class="sub">批准文号：国药准字H19983028 ｜ 注意事项</div>
<div class="audio-box"><b>&#128266; 语音朗读（点击播放）</b>
<audio controls preload="metadata" src="../audio/(基)硝酸毛果芸香碱滴眼液-国药准字H19983028.mp3"></audio>
</div>
<div class="content"><p>1.哮喘，急性角膜炎慎用。</p>
<p>2.瞳孔缩小常引起暗适应困难，应告知需在夜间开车或从事照明不好的危险职业的患者特别小心。</p>
<p>3.定期检查眼压。</p>
<p>如出现视力改变，需查视力、视野、眼压描记及房角等，根据病情变化改变用药及治疗方案。</p>
<p>4.为避免吸收过多引起全身不良反应，滴眼后需用手指压迫泪囊部1-2分钟。</p>
<p>5.如意外服用，需给予催吐或洗胃；</p>
<p>如过多吸收出现全身中毒反应，应使用阿托品类抗胆碱药进行对抗治疗。</p>
<p>6.眼用制剂在启用后最多可使用4周。</p></div>
