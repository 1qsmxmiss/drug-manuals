<div class="content"><p>1.孕妇及哺乳期妇女慎用。</p>
<p>2.儿童请在医师指导下使用。</p>
<p>3.连续使用5日症状未见缓解应停药就医。</p>
<p>4.甲状腺疾病患者慎用。</p>
<p>5.如服用过量或出现严重不良反应，应立即就医。</p>
<p>6.对本品过敏者禁用，过敏体质者慎用。</p>
<p>7.本品性状发生改变时禁止使用。</p>
<p>8.请将本品放在儿童不能接触的地方。</p>
<p>9.儿童必须在成人监护下使用。</p>
<p>10.如正在使用其他药品，使用本品前请咨询医师或药师。</p></div>
