<div class="content"><p>未见地氯雷他定对驾驶及操作机器的能力造成影响。</p>
<p>然而需向患者说明，有极少数的患者出现困倦现象，这样会影响他们的驾驶和使用机械的能力。</p>
<p>严重肾功能不全患者慎用。</p>
<p>地氯雷他定应慎用于具有癫痫病史或家族史的患者。</p>
<p>特别是幼儿，在地氯雷他定治疗期间可能更容易癫痫发作。</p>
<p>治疗时，如果患者癫痫发作，医疗保健提供者可能会考虑停用地氯雷他定。</p></div>
