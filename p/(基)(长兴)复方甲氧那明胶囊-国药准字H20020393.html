<div class="content"><p>1、心脏病、高血压、青光眼、体弱多病者、排尿困难及老年患者慎用。</p>
<p>2、服用本品可引起嗜睡，故用药期间不宜驾驶车辆、管理机器及高空作业等。</p>
<p>3、勿与其它镇咳祛痰药、感冒药、抗组胺药及镇静药合用。</p>
<p>4、多次服药症状未改善应停止服药并及时就医。</p>
<p>5、小儿应在父母监督下用药。</p></div>
