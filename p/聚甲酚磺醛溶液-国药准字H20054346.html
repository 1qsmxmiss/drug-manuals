<div class="audio-box"><b>&#128266; 语音朗读（点击播放）</b>

<div class="content"><p>1.聚甲酚磺醛会加速伤口的愈合过程。</p>
<p>当坏死组织从病灶处脱落，有时甚至是大片脱落，亦无需惊恐。</p>
<p>2.治疗期间避免性交，不要使用刺激性肥皂清洗患处。</p>
<p>3.行经时停止用药。</p>
<p>4.注意防止聚甲酚磺醛与眼部接触。</p>
<p>5.所有治疗用具使用后均应在水中浸泡（必要时加入1-2%的氢氧化钠）。</p>
<p>6.如果棉织物及皮革与本品接触后，必须在其未干前立即用水洗净。</p></div>
