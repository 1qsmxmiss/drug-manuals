<div class="content"><p>1.慎重给药对高龄患者应慎重给药（高龄患者低钾血症发生率高）（参照[老年用药]）。</p>
<p>2.重要注意事项由于本品中含甘草酸苷，所以与其它含有甘草的制剂并用时，可增加体内甘草酸苷含量，容易出现假性醛固酮增多症，应予注意。</p>
<p>3.给药时注意药品交付时，应指导服药时请将片剂从铝箔包装中取出后再服用（有报道将铝箔一起服用而导致食道粘膜损伤，甚至穿孔引起纵膈炎症等危重并发症）。</p></div>
