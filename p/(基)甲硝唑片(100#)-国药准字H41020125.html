<div class="content"><p>(1)对诊断的干扰：本品的代谢产物可使尿液呈深红色。</p>
<p>(2)原有肝脏疾患者剂量应减少。</p>
<p>出现运动失调或其他中枢神经系统症状时应停药。</p>
<p>重复一个疗程之前，应做白细胞计数。</p>
<p>厌氧菌感染合并肾功能衰竭者，给药间隔时间应由8小时延长至12小时。</p>
<p>(3)本品可抑制酒精代谢，用药期间应戒酒，饮酒后可能出现腹痛、呕吐、头痛等症状。</p></div>
