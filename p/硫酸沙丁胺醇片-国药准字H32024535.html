<div class="audio-box"><b>&#128266; 语音朗读（点击播放）</b>

<div class="content"><p>1.本品仅有支气管扩张作用，作用持续时间约4小时，不能过量使用。</p>
<p>2.高血压，冠状动脉供血小足，心血管功能不全，糖尿病、甲状腺机能亢进等患者慎用。</p>
<p>3.久用本品易产生耐受性，使药效降低。</p>
<p>此时患者对肾上腺素等扩张支气管作用的药物也同样产生耐受性，使支气管痉挛，不易缓解，哮喘加重。</p>
<p>4.运动员慎用。</p></div>
