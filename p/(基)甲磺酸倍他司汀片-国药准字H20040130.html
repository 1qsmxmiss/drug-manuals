<h1>(基)甲磺酸倍他司汀片</h1>
<div class="sub">批准文号：国药准字H20040130 ｜ 注意事项</div>
<div class="audio-box"><b>&#128266; 语音朗读（点击播放）</b>

<div class="content"><p>勿与抗组胺类药物（如氯雷他定、西替利嗪等）联合使用。</p>
<p>对下列患者需慎重给药：1.有消化道溃疡病史的患者或活动期消化道溃疡的患者。</p>
<p>[由于本品具有组胺样作用，可能会通过影响H2受体而导致胃酸分泌]2.有支气管哮喘病史的患者。</p>
<p>[由于本品具有组胺样作用，可能会通过影响H1受体而导致呼吸道收缩]3.肾上腺髓质瘤患者。</p>
<p>[由于本品具有组胺样作用，可能会导致肾上腺素分泌过度而使血压上升]</p></div>
