<div class="sub">批准文号：国药准字H20051153 ｜ 注意事项</div>
<div class="audio-box"><b>&#128266; 语音朗读（点击播放）</b>

<div class="content"><p>1、本品勿涂于乳房、外阴及粘膜部位。</p>
<p>2、长期应用可能增加子宫内膜癌发生的危险性。</p>
<p>3、乳房病患者或有乳腺癌家族史者慎用。</p>
<p>4、高血压或有高血压家族史患者应定期监测血压。</p>
<p>如在用药过程中出现血压升高，则应中止应用本品。</p>
<p>5、流行病学调查发现，激素替代治疗与静脉血栓发作的危险性增加相关。</p>
<p>6、使用一个周期无效者停用。</p></div>
