<div class="content"><p>在对18至41岁男性进行的临床研究中，应用本品12个月后血清前列腺特异抗原(PSA)从0.7ng/ml的基础水平降至0.5ng/ml。</p>
<p>本品在用于治疗患有良性前列腺增生(BPH)的老年男性秃发病人时必须考虑到前列腺特异性抗原水平会降低约50%。</p>
<p>没有数据显示保法止对于驾驶和使用机器的能力有影响。</p>
<p>使用本品期间，如出现任何不良事件和/或不良反应，请咨询医生。</p>
<p>同时使用其他药品，请告知医生。</p>
<p>请放置于儿童不能够触及的地方。</p></div>
