<div class="content"><p>1.脾胃虚弱者慎用。</p>
<p>2.因为儿童急性支气管炎病情变化较快，服用本品期间需密切关注患儿的病情变化，根据需要可及时调整治疗方案。</p>
<p>3.本品临床试验期间有少数患者出现轻度的ALT异常，尚无法确定与本品的相关性，肝功能异常者慎用。</p>
<p>4.本品含蔗糖，糖尿病患儿慎用。</p>
<p>5.本品尚无1岁以下儿童使用的安全性和有效性数据。</p>
<p>6.本品尚无超7天疗程使用的安全性和有效性数据。</p>
<p>7.过敏体质者慎用。</p></div>
