<h1>苯扎氯铵溶液</h1>
<div class="sub">批准文号：国药准字H20063993 ｜ 注意事项</div>
<div class="audio-box"><b>&#128266; 语音朗读（点击播放）</b>

<div class="content"><p>1、本品为外用消毒防腐药，切不可内服。</p>
<p>不能用于灌肠。</p>
<p>2、本品直接外用，请向医师或药师咨询，医师或药师根据临床患者耐受性进行使用药浓度的调整。</p>
<p>3、低温时可能出现混浊或沉淀，可置于温水中加温，振摇使溶后使用。</p>
<p>4、在涂布部位如有烧灼感，局部发红，瘙痒时，应停止用药，洗净局部药物，并向医师咨询。</p>
<p>5、不能在黏膜、创面或炎症部位长期或者大面积使用。</p>
<p>6、当药品性状发生改变时禁止使用。</p>
<p>7、儿童必须在成人监护下使用。</p>
<p>8、请将此药品放置在儿童不能接触的地方。</p></div>
