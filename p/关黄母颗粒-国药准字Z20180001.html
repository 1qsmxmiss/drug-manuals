<div class="content"><p>1.忌食生冷辛辣。</p>
<p>2.子宫肌瘤直径大于2cm，或子宫息肉者慎用。</p>
<p>3.服药期间注意监测雌二醇(E2)、卵泡刺激素(FSH)、子宫内膜厚度、乳腺的变化。</p></div>
