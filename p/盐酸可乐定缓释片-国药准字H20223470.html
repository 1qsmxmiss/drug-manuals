<div class="content"><p>1.低血压/心动过缓盐酸可乐定缓释片可导致剂量相关的血压和心率降低。</p>
<p>在开始用药前、剂量增加后和用药期间应定期监测心率和血压。</p>
<p>对于有低血压病史的患者及可能由于低血压和心动过缓而导致疾病加重的基础</p></div>
