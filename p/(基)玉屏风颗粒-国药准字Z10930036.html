<div class="content"><p>1.忌油腻、不易消化食物。</p>
<p>2.本品宜饭前服用。</p>
<p>3.感冒发热病人不宜服用。</p>
<p>4.按照用法用量服用，高血压、心脏病、肝病、糖尿病、肾病等患者应当在医师指导下服用。</p>
<p>5.孕妇、哺乳期妇女应当在医师指导下服用。</p>
<p>6.服药二周症状无缓解应去医院就诊，服药期间症状加重者应当立即停药并去医院就诊。</p>
<p>7.过敏体质者慎用。</p>
<p>8.本品性状发生改变时禁止使用。</p>
<p>9.请将本品放在儿童不能接触的地方。</p>
<p>10.如正在使用其他药品，使用本品前请咨询医师或药师。</p></div>
