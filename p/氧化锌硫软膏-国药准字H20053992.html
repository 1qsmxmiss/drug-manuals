<div class="content"><p>1.用药前先洗净患处。</p>
<p>2.避免接触眼睛和其他黏膜（如口、鼻等）。</p>
<p>3.用药部位如有烧灼感、红肿等情况应停药，并将局部药物洗净，必要时向医师咨询。</p>
<p>4.对本品过敏者禁用，过敏体质者慎用。</p>
<p>5.本品性状发生改变时禁止使用。</p>
<p>6.请将本品放在儿童不能接触的地方。</p>
<p>7.儿童必须在成人监护下使用。</p>
<p>8.如正在使用其他药品，使用本品前请咨询医师或药师。</p></div>
