<h1>(集)盐酸西替利嗪滴剂</h1>
<div class="sub">批准文号：HC20181014 ｜ 注意事项</div>
<div class="audio-box"><b>&#128266; 语音朗读（点击播放）</b>
<audio controls preload="metadata" src="../audio/(集)盐酸西替利嗪滴剂-HC20181014.mp3"></audio>
</div>
<div class="content"><p>1.癫痫患者以及有惊厥风险的患者应慎用。</p>
<p>2.因西替利嗪有可能增加尿潴留的风险，有尿潴留易感因素（例如脊髓损害、前列腺肥大）的患者慎用。</p>
<p>3.抗组胺药物会降低皮肤过敏测试结果的灵敏度，所以接受这类测试前应停药3天。</p>
<p>4.酒后避免作用：在治疗剂量下，本品不会强化酒精作用（血液酒精浓度每公升0.8克），但是必须小心。</p>
<p>5.司机、操作机器或高空作业人员慎用：对健康志愿者的试验表明，每日服用20或25mg本品可能影响人的机敏性和反应时间。</p>
<p>少数情况下服用10mg本品会导致机敏性降低。</p></div>
