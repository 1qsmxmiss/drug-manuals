<div class="content"><p>（1）本品长期服用，可导致肾脏损害，严重者可致肾乳头坏死或尿毒症，甚至可能诱发肾盂痛和膀胱痛。</p>
<p>不宜长久使用，以免发生中性粒细胞缺乏，用药超过1周要定期检查血象。</p>
<p>（2）氨基比林在胃酸下与食物发生作用，可形成致癌性亚硝基化合物，特别是亚硝胺，因此有潜在的致癌性。</p>
<p>（3）长期服用可造成依赖性，并产生耐受。</p>
<p>（4）对各种创伤性剧痛和内脏平滑肌绞痛无效。</p>
<p>（5）严禁用于食品和饲料加工。</p></div>
