<div class="sub">批准文号：国药准字H10980317 ｜ 注意事项</div>

<div class="content"><p>1、严格按推荐用量使用，连续使用不得超过7天，如需继续使用，应咨询医师。</p>
<p>2、高血压、冠心病、甲状腺功能亢进、糖尿病等患者慎用。</p>
<p>3、2-6岁儿童应在医师指导下使用。</p>
<p>4、如使用过量或出现严重不良反应，应立即就医。</p>
<p>5、对本品过敏者禁用，过敏体质者慎用。</p>
<p>6、本品性状发生改变时禁止使用。</p>
<p>7、请将本品放在儿童不能接触的地方。</p>
<p>8、儿童必须在成人监护下使用。</p>
<p>9、如正在使用其他药品，使用本品前请咨询医师或药师。</p></div>
